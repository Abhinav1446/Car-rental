<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Alex Cars</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="admin-shell">

  <header class="admin-header">
    <div class="container">
      <div class="footer-brand" style="color:var(--cream);">
        <span class="brand-mark" id="adminBrandMark">A</span>
        <span id="adminBrandName">Alex Cars - Owner dashboard</span>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <span id="adminEmail" class="form-note" style="color:var(--cream-dim);"></span>
        <button id="logoutBtn" class="btn btn-outline" style="color:var(--cream); border-color:rgba(246,243,236,0.4);">Log out</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="vehicles">Vehicles</button>
      <button class="admin-tab" data-tab="bookings">Bookings</button>
    </div>

    <!-- ============================= VEHICLES ============================= -->
    <section id="tab-vehicles" class="admin-panel">
      <div class="form-card" style="margin-bottom:28px;">
        <h3 class="mt-0" id="vehicleFormTitle">Add a vehicle</h3>
        <div id="vehicleFormError"></div>
        <form id="vehicleForm">
          <input type="hidden" id="vehicleId" />
          <div class="field-row">
            <div class="field">
              <label for="v_name">Vehicle name</label>
              <input type="text" id="v_name" required placeholder="e.g. Maruti Swift" />
            </div>
            <div class="field">
              <label for="v_type">Type</label>
              <input type="text" id="v_type" placeholder="Hatchback / SUV / Sedan" />
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="v_seats">Seats</label>
              <input type="number" id="v_seats" min="1" max="20" value="5" />
            </div>
            <div class="field">
              <label for="v_price">Price per day (&#8377;)</label>
              <input type="number" id="v_price" min="0" step="1" required />
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="v_transmission">Transmission</label>
              <select id="v_transmission">
                <option>Manual</option>
                <option>Automatic</option>
              </select>
            </div>
            <div class="field">
              <label for="v_fuel">Fuel</label>
              <select id="v_fuel">
                <option>Petrol</option>
                <option>Diesel</option>
                <option>CNG</option>
                <option>Electric</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="v_photo_file">Vehicle photo</label>
            <input type="file" id="v_photo_file" accept="image/*" />
            <input type="hidden" id="v_photo" />
            <p id="photoUploadStatus" class="form-note" style="margin-top:6px;"></p>
            <img id="photoPreview" alt="Vehicle photo preview" style="display:none; max-width:180px; margin-top:8px; border-radius:8px; border:1px solid #ddd6c4;" />
          </div>
          <div class="field">
            <label for="v_description">Description</label>
            <textarea id="v_description" rows="2" placeholder="A short note customers will see"></textarea>
          </div>
          <div class="field" style="display:flex; align-items:center; gap:8px;">
            <input type="checkbox" id="v_available" checked style="width:auto;" />
            <label for="v_available" style="margin:0;">Available for booking</label>
          </div>

          <div style="display:flex; gap:10px;">
            <button type="submit" class="btn btn-primary" id="vehicleFormSubmit">Add vehicle</button>
            <button type="button" class="btn btn-outline" id="vehicleFormCancel" style="display:none;">Cancel edit</button>
          </div>
        </form>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Type</th>
              <th>Price/day</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="vehiclesTableBody">
            <tr><td colspan="5">Loading&hellip;</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- ============================= BOOKINGS ============================= -->
    <section id="tab-bookings" class="admin-panel" style="display:none;">

      <div id="bookingStats" class="vehicle-grid" style="grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 24px;"></div>

      <div class="form-card" style="margin-bottom: 20px; padding: 16px 18px;">
        <div style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px;">
          <div class="field" style="margin-bottom:0;">
            <label for="bookingSearch">Search</label>
            <input type="text" id="bookingSearch" placeholder="Customer name or phone" />
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="statusFilter">Status</label>
            <select id="statusFilter">
              <option value="all">All statuses</option>
              <option value="pending">Pending</option>
              <option value="paid">Paid</option>
              <option value="confirmed">Confirmed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="paymentFilter">Payment</label>
            <select id="paymentFilter">
              <option value="all">All methods</option>
              <option value="upi">UPI</option>
              <option value="cash">Cash</option>
            </select>
          </div>
        </div>
        <p id="bookingResultsCount" class="form-note" style="margin: 10px 0 0;"></p>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Reference</th>
              <th>Customer</th>
              <th>Vehicle</th>
              <th>Dates</th>
              <th>Amount</th>
              <th>Payment</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="bookingsTableBody">
            <tr><td colspan="8">Loading&hellip;</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/vehicle-card.js"></script>
  <script src="js/admin-dashboard.js"></script>
</body>
</html>
