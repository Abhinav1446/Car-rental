<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner login - Alex Cars</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav id="site-nav"></nav>

  <main class="section">
    <div class="container" style="max-width: 440px;">
      <div class="form-card">
        <h2 class="mt-0">Owner login</h2>
        <p class="form-note" style="margin-bottom:20px;">This area is for managing the fleet and bookings. Not a customer? Head back to the <a href="index.html">homepage</a>.</p>

        <div id="loginError"></div>

        <form id="loginForm" class="stack">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="username" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-dark btn-block">Log in</button>
        </form>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/vehicle-card.js"></script>
  <script src="js/admin-login.js"></script>
</body>
</html>
