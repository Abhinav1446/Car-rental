<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fleet - Alex Cars</title>
  <meta name="description" content="Browse all available cars for self-drive rental." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav id="site-nav"></nav>

  <header class="hero" style="padding: 56px 0;">
    <div class="hero-inner">
      <p class="hero-eyebrow">Fleet</p>
      <h1 style="max-width: none; font-size: clamp(2.2rem, 5vw, 3.2rem);">Every vehicle we have on the road.</h1>
      <p class="hero-tagline">Filter to see what's free right now, or browse the full fleet.</p>
    </div>
  </header>

  <hr class="route-line" />

  <main class="section">
    <div class="container">
      <div class="section-head">
        <div class="stack" style="gap:6px;">
          <div style="display:flex; gap:10px; align-items:center;">
            <label style="display:flex; align-items:center; gap:8px; font-weight:600; font-size:0.9rem; cursor:pointer;">
              <input type="checkbox" id="availableOnlyToggle" checked />
              Show available vehicles only
            </label>
          </div>
          <p id="resultsCount" class="form-note">Loading&hellip;</p>
        </div>
      </div>

      <div id="fleetGrid" class="vehicle-grid">
        <p class="form-note">Loading vehicles&hellip;</p>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/vehicle-card.js"></script>
  <script src="js/fleet.js"></script>
</body>
</html>
