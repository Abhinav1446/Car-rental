<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Alex Cars</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav id="site-nav"></nav>

  <header class="hero" style="padding: 56px 0;">
    <div class="hero-inner">
      <p class="hero-eyebrow">Contact</p>
      <h1 style="max-width: none; font-size: clamp(2.2rem, 5vw, 3.2rem);">Talk to us directly.</h1>
      <p class="hero-tagline">No support tickets, no queue &mdash; just a message straight to the owner.</p>
    </div>
  </header>

  <hr class="route-line" />

  <main class="section">
    <div class="container" style="display:grid; grid-template-columns: 1fr 1fr; gap: 32px;">
      <div class="form-card">
        <h3 class="mt-0">Reach us</h3>
        <div id="contactLinks" class="stack" style="gap:0;"></div>
      </div>

      <form id="contactForm" class="form-card stack">
        <h3 class="mt-0">Send a quick message</h3>
        <p class="form-note">This opens WhatsApp with your message pre-filled &mdash; nothing is sent until you hit send there.</p>
        <div id="contactFormError"></div>
        <div class="field">
          <label for="c_name">Your name</label>
          <input type="text" id="c_name" required />
        </div>
        <div class="field">
          <label for="c_message">Message</label>
          <textarea id="c_message" rows="4" required placeholder="I'd like to ask about..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Continue on WhatsApp</button>
      </form>
    </div>

    <style>
      @media (max-width: 760px) {
        main.section > .container { grid-template-columns: 1fr !important; }
      }
    </style>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/vehicle-card.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
